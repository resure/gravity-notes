[package]
name = "app"
version = "0.6.0"
description = "Gravity Notes desktop app"
authors = ["Gravity Notes"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Live watching of the notes folder (FSEvents on macOS), for external-edit refresh.
notify = "8.2"
notify-debouncer-mini = "0.7"

# The tall-titlebar toolbar trick in apply_macos_chrome (already in the tree via tao/wry).
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSToolbar", "NSWindow"] }
