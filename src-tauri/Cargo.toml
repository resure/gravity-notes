[package]
name = "app"
version = "1.0.0"
description = "Sol desktop app"
authors = ["Sol"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Live watching of the notes folder (FSEvents on macOS), for external-edit refresh. The watcher is
# never invoked on mobile (the frontend doesn't call `notes_watch` there), but the crates compile
# cross-platform so they stay in the shared dep set rather than forcing every watcher site behind a
# `#[cfg]`.
notify = "8.2"
notify-debouncer-mini = "0.7"

# Desktop-only plugins. The updater has no iOS/Android support (App Store / Play own updates) and
# `process` (relaunch after an in-place update) rides along with it. Neither is registered on mobile
# (see the `#[cfg(desktop)]` block in `run`'s setup); gated here so they aren't compiled for the iOS
# target, where the updater crate doesn't build.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# iOS-only: our in-tree plugin for native security-scoped folder access (Files picker + bookmark).
# The desktop app opens a plain folder path via the `notes_*` commands, so this is compiled only for
# iOS, where the folder must be a user-picked, bookmark-persisted, security-scoped URL.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-icloud-fs = { path = "../plugins/icloud-fs" }

# The tall-titlebar toolbar trick in apply_macos_chrome (already in the tree via tao/wry).
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSToolbar", "NSWindow"] }
