[package]
name = "tauri-plugin-icloud-fs"
version = "0.1.0"
authors = ["Gravity Notes"]
description = "iOS security-scoped folder access (Files picker + bookmark) for Gravity Notes"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-icloud-fs"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
